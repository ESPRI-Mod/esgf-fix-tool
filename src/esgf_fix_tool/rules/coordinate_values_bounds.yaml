# Missing time steps of cltcalipso 3hr (pilot historical-CO2conc-01): the model team asked on 2026-11-25 to fill them
# with _FillValue while they look for the cause. The fix finds the missing steps itself (against the axis of the file
# name), lists them in the fixlog and in the global history; it refuses anything but a few missing steps on a clean
# axis. Scoped to the decision: the same symptom elsewhere comes back for a decision. Extended on 2026-11-26 to
# esm-hist (CM6-ESMCO2-FT.p1.3.esm-hist.01) and the scen7 experiments: the same model, the same symptom (00:00 of
# 1 January missing every year).
- id: C122
  check: \[CMIP7\] \[TIME001\] Check Time Squareness
  message: \d+ time values do not match the expected axis\. First incident at index \d+.*var=cltcalipso, midpoint=False\)$
  dataset: CMIP7\.[^.]+\.cltcalipso\.tpt-u-hxy-u\.3hr\.[^.]+\.[^.]+\.IPSL-CM6-ESMCO2\.(?:historical|esm-hist|scen7-[a-z]+)\.
  action: fix
  fix: fill_missing_time_steps
  params:
    var: cltcalipso
  note: Model team decision of 2026-11-25 (pilot historical-CO2conc-01). Insert the missing 3-hourly steps with a fully
    missing field (_FillValue), with their exact time; the existing values are copied unchanged and checked; the global
    history lists the filled steps.
- id: C122b
  check: \[CMIP7\] \[TIME003\] Check Time Range vs Filename
  message: The filename time range '\d{12}-\d{12}' does not match the first and last data endpoints.*
  dataset: CMIP7\.[^.]+\.cltcalipso\.tpt-u-hxy-u\.3hr\.[^.]+\.[^.]+\.IPSL-CM6-ESMCO2\.(?:historical|esm-hist|scen7-[a-z]+)\.
  action: fix
  fix: fill_missing_time_steps
  params:
    var: cltcalipso
  note: Same decision as C122; the missing last step (00:00 of the file name's end) is one of the filled steps.
- id: C122c
  check: \[Continuity\] Time continuity
  message: Gap in time axis \(between files\) - previous .* - delta-t 6\.0 hours$
  dataset: CMIP7\.[^.]+\.cltcalipso\.tpt-u-hxy-u\.3hr\.[^.]+\.[^.]+\.IPSL-CM6-ESMCO2\.(?:historical|esm-hist|scen7-[a-z]+)\.
  action: fix
  fix: fill_missing_time_steps
  params:
    var: cltcalipso
  note: Same decision as C122; the step missing between two files is the last one of the previous file, filled there.

# Files whose name ends after their data (scen7-vl/hl, IPSL-CM6-ESMCO2): the atmosphere was restarted from 2040 and the
# file being written then holds data up to 2039 only, under its planned end; the next file starts in 2040. Only the
# end of the name moves earlier (the data must start and end where the new name says); never over an existing file.
# After C122b, so cltcalipso 3hr keeps its own decision (the monthly and daily cltcalipso are renamed here).
- id: C125
  check: \[CMIP7\] \[TIME003\] Check Time Range vs Filename
  message: The filename time range '(?P<source>\d+-\d+)' does not match the first and last data endpoints, which resolve to '(?P<target>\d+-\d+)'\.
  dataset: CMIP7\.[^.]+\.(?!cltcalipso\.tpt-u-hxy-u\.3hr\.)[^.]+\.[^.]+\.[^.]+\.[^.]+\.[^.]+\.IPSL-CM6-ESMCO2\.scen7-[a-z]+\.
  action: fix
  fix: sync_filename_time_range
  params:
    source: '{source}'
    target: '{target}'
  note: Rename only, to the data's real end (the start must not change, the end only moves earlier). No data or
    attribute change. 170 files in each of scen7-vl and scen7-hl, every one followed by a file starting in 2040.
