  message: 'It is required for ''(?P<var>[^'']+)'' coordinates attribute not to include horizontal (?P<role>latitude|longitude) coordinate ''(?P<coordinate>nav_lat|nav_lon|latitude|longitude)'', because (?P=role) is not required by branded variable ''(?P<branded_variable>[^'']+)''\.$'
  action: fix
  fix: drop_unrequested_horizontal_reference
  params: {var: "{var}", role: "{role}", coordinate: "{coordinate}", branded_variable: "{branded_variable}"}
  note: Remove only the requested tokens, accepting canonical names after rename. Preserve arrays and other coordinates; runtime enforces 21 reviewed DR policies.

- id: C070
  check: '\[CMIP7\] \[COORD011\] Horizontal grid coordinates$'
  message: '(?:It is required for ''lat'' on the configured rectilinear grid to be a 1-D coordinate variable; found ''nav_lat'' with dimensions \[''y'', ''x''\]\. Dependent horizontal-grid checks could not be evaluated\.|The required coordinate for the configured rectilinear grid is ''lat\(lat\)'' for latitude; standard_name=''latitude'' identified ''nav_lat''\.|The required horizontal coordinate\(s\) are absent: \[''latitude''\]\.)$'
  dataset: 'CMIP7\.OCE\.(?P<var>hfbasin|hfbasinpmadv|hfbasinpmdiff|htovgyre|htovovrt|sltbasin|sltovgyre|sltovovrt)\.tavg-u-hyb-sea\.'
  action: fix
  fix: fix_basin_profile_latitude
  params: {var: "{var}"}
  note: The eight g112/hyb basin transports use true latitude lat(lat), standard_name=latitude, units=degrees_north and lat_bnds at both 331 and 332 native sizes. Only msfty uses rlat. Accept former rlat/rlat_bnds as source aliases to repair files from an older plan; select the exact missing-latitude diagnostic as well. Keep 331 rows and restore the 32 placeholders only after every retained latitude matches the supplied T-column 97 reference and all affected science rows are masked. Preserve existing centers/bounds on already-restored files, basin/sector, all scientific values and storage. Rename in place when x is already absent; otherwise squeeze only x=1 in one grouped rewrite. Legacy 332-point endpoint convention remains unchanged.

