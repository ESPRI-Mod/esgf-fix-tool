  message: '(?:The ''coordinates'' attribute of variable ''(?:sfx|sfy|sob|tob)'' references non-existent variable ''(?:nav_lat|nav_lon)''\.|(?:sfx|sfy|sob|tob)''s auxiliary coordinate specified by the coordinates attribute, (?:nav_lat|nav_lon), is not a variable in this dataset|Referenced variables not found: \[''(?:nav_lat|nav_lon)''(?:, ''(?:nav_lat|nav_lon)'')?\]|The required horizontal coordinate\(s\) are absent: \[''longitude'', ''latitude''\]\.)$'
  dataset: CMIP7\.(?:OCE|SRF)\.(?:sfx\.tavg-u-hxy-sea\.mon\.glb\.g168|sfy\.tavg-u-hxy-sea\.mon\.glb\.g169|(?:sob|tob)\.tavg-u-hxy-sea\.mon\.glb\.g112)\.
  action: fix
  fix: inject_nemo_u_coordinates
  params: {}
  note: User-approved injection from the supplied eORCA1.4.2 domain, selected by product and geometry. sfx/g168 uses gphiu/glamu (U); sfy/g169 uses gphiv/glamv (V); sob,tob/g112 use gphit/glamt (T). Store exact doubles in the same offline JSON with checksums. For bottom diagnostics create canonical latitude/longitude and update coordinates in the same pass. Require y=331,x=360 and the reviewed standard_name; never copy U coordinates to V/T. Preserve science, masks, packing, compression and matching existing arrays. Keep the legacy C119 fix name for existing plans.

- id: C119v
  check: \[CMIP7\] \[COORD011\] Horizontal grid coordinates$
  message: 'It is required for horizontal auxiliary coordinate ''(?:latitude|longitude|nav_lat|nav_lon)'' to have a bounds attribute naming its vertex variable; dependent vertex checks could not be evaluated\.$'
  dataset: CMIP7\.(?:OCE|SRF)\.(?:sfx\.tavg-u-hxy-sea\.mon\.glb\.g168|sfy\.tavg-u-hxy-sea\.mon\.glb\.g169|(?:sob|tob)\.tavg-u-hxy-sea\.mon\.glb\.g112)\.
  action: fix
  fix: inject_nemo_vertices
  params: {}
  note: Copy existing XIOS vertices from hfx/U for sfx, hfy/V for sfy and areacello/T for sob/tob. Use the bundled compressed JSON with exact doubles and per-array checksums. Validate central-coordinate compatibility before appending vertices(y,x,vertices=4) and bounds attributes. Only the 14 approved sfy cells at y=330,x=196..209 may differ, with exact native V centers and all scientific records masked in both donor and target. Preserve centers, science, masks and storage; never reconstruct vertices or read donor files during parallel application.

- id: C098
  check: \[CF-Conventions\] (?:§7\.1 Cell Boundaries|§3\.3 Standard Name)$
  message: '(?:\[Appendix A\] Attribute "bounds" should not be present in non-coordinate data \(D\) variable "|Attribute long_name or/and standard_name is highly recommended for variable )(?P<var>nav_lat|nav_lon|bounds_nav_lat|bounds_nav_lon)(?:"\. This attribute may only appear in coordinate data \(C\)\.)?$'
  action: fix
  fix: drop_unused_horizontal_bounds
  params:
    var: '{var}'
  note: For approved hm outputs, remove unused horizontal coordinates and vertex arrays after checking every retained reference. For hyb, only detach an orphan bounds attribute. Never delete a grid needed by retained data.
