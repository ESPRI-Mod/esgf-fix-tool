- id: C097
  check: '\[CMIP7\] \[ATTR005\] Consistency: Filename vs Global Attributes$'
  message: Filename component 'grid_label' \('(?P<source>g111|g112)'\) does not match global attribute \('(?P<target>g010|g011|g012|g014)'\)\.$
  action: fix
  fix: sync_filename_grid_label
  params:
    source: '{source}'
    target: '{target}'
  note: Validate the existing reviewed grid mapping and synchronize only the filename component. Refuse collisions before
    applying any file. Replay resolves the explicit final basename.

- id: C110
  check: \[CMIP7\] \[COORD011\] Horizontal grid cell count$
  message: Registered grid 'g111' defines n_cells=20592, but the file's horizontal coordinate dimensions contain 143 cells\..*
  action: review
  note: Thirteen zonal products require an appropriate registered grid label. No approved replacement is available in this
    catalogue.

- id: C113
  check: '\[CMIP7\] \[ATTR008\] Consistency: frequency vs branded_variable$|\[CMIP7\] \[ATTR012\] Consistency: region vs branded_variable$'
  message: (?:Frequency 'day' is not listed for branded variable 'sieqthick_tavg-u-hxy-si'.*Submission at additional frequencies
    is allowed\.|Region 'glb' is not listed for branded variable '(?:intdic|intpbfe|intpbsi|intpn2)_tavg-u-hxy-sea'.*Submission
    for additional regions is allowed\.)$
  action: waive
  note: The diagnostic explicitly permits these extra frequencies/regions. Preserve the data coverage and branding.
