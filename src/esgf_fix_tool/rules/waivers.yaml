# Scoped waivers: findings decided to be false positives IN A GIVEN CONTEXT, never globally.
# Each rule restricts the dataset id (CMIP7.<realm>.<variable>.<branding>.<frequency>.<region>.<grid>.<source>.
# <experiment>.<variant>) at least to the experiment the decision was taken for. The same finding in another
# experiment is not waived: it shows up again and someone decides again (widening the scope if it holds).
# Loaded after the reviewed catalogues and before the fallbacks (e.g. it wins over S031).

- id: W001
  check: \[Consistency\] Time coverage$
  message: "Time series starts at '1950' while other time series start at '1850'$"
  dataset: CMIP7\.[^.]+\.[^.]+\.[^.]+\.3hr\.[^.]+\.[^.]+\.[^.]+\.historical\.
  action: waive
  scope: 3hr datasets of historical
  decided: meeting of 2026-11-24 (pilot historical-CO2conc-01, IPSL-CM6-ESMCO2)
  note: The CMIP7 Data Request only asks for 3hr output from 1950 in historical; the other frequencies start in 1850.

- id: W002
  check: \[CMIP7\] \[TIME001\] Check Time Squareness
  message: \d+ time values do not match the midpoints of their climatology intervals\.
  dataset: CMIP7\.[^.]+\.[^.]+\.tclm-[^.]+\.mon\.[^.]+\.[^.]+\.[^.]+\.(?:historical|esm-hist)\.
  action: waive
  scope: monthly climatologies (tclm) of historical and esm-hist
  decided: meeting of 2026-11-24 (pilot historical-CO2conc-01, IPSL-CM6-ESMCO2); widened on 2026-11-26 to
    esm-hist (CM6-ESMCO2-FT.p1.3.esm-hist.01, QA 3; the same pfull/phalf tclm files, the same findings)
  note: Date convention of the climatologies (a representative date of each month, not the midpoint of the whole
    climatology interval); the climatology bounds themselves are right.

- id: W003
  check: \[Continuity\] Time continuity
  message: Gap in time axis \(between files\)
  dataset: CMIP7\.[^.]+\.[^.]+\.tclm-[^.]+\.mon\.[^.]+\.[^.]+\.[^.]+\.(?:historical|esm-hist)\.
  action: waive
  scope: monthly climatologies (tclm) of historical and esm-hist
  decided: meeting of 2026-11-24 (pilot historical-CO2conc-01, IPSL-CM6-ESMCO2); widened on 2026-11-26 to
    esm-hist (CM6-ESMCO2-FT.p1.3.esm-hist.01, QA 3; the same pfull/phalf tclm files, the same findings)
  note: Two climatologies of different periods (e.g. 1850-1949 and 1950-2021) are not a time series; the "gap"
    between them (1900 -> 1986) is not missing data. Gaps in ordinary series stay S031.
