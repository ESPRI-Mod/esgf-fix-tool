- id: C032
  check: \[CMIP7\] \[COORD001\] Coordinate identity and structure$
  message: The required text auxiliary coordinate 'sector' for coordinate ID 'basin' is absent, so its configured dependent
    coordinate checks could not be evaluated\.$
  action: fix
  note: Shared basin recipe C032/C078/C096/C101a. Keep numeric basin values as dimensionless indices; sector carries the ordered region labels.
  fix: fix_basin_sector
  params: {}
  dataset: CMIP7\.OCE\.(?:hfbasin|hfbasinpmadv|hfbasinpmdiff|htovgyre|htovovrt|msfty|sltbasin|sltovgyre|sltovovrt)\.

- id: C078
  check: \[CF-Conventions\] §6\.1 Labels$
  message: 6\.1\.1 '1\.02\.03\.0' specified by 'basin' is not a valid region$
  dataset: CMIP7\.OCE\.(hfbasin|hfbasinpmadv|hfbasinpmdiff|htovgyre|htovovrt|msfty|sltbasin|sltovgyre|sltovovrt)\..*\.IPSL-CM6-ESMCO2\.esm-piControl-spinup\.r1i1p1f1$
  action: fix
