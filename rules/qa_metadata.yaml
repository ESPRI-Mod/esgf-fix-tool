  fix: rename_redundant_text_label
  params:
    var: '{var}'
  note: Delete line/type and legacy line_label/type_label only after comparing ordered labels with sector, ignoring trailing NUL/space padding. Keep dimensions. Delegate the three corrupt four-passage ice products to C105's approved method.
