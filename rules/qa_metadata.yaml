- id: C106
  check: \[CF-Conventions\] §7\.4 Climatological Statistics$
  message: 'The "time: method within years/days over years/days" format is not correct in variable .*'
  dataset: CMIP7\.[^.]+\.[^.]+\.tclm-[^.]+\.mon\.
  action: fix
  fix: rebuild_monthly_climatology
  params: {}
  note: User-approved per-file equal-year monthly climatology. Validate complete calendar months, average all time-dependent floating fields including ps, rebuild 12 times and climatology bounds. Preserve branding and static arrays. Replays validate existing 12-point climatologies.
- id: C106r
  check: \[CF-Conventions\] §7\.4 Climatological Statistics$
  message: 'The "time: method within years/days over years/days" format is not correct in variable .*'
  action: review
  note: Non-tclm products (including tmaxavg/tminavg) need their own approved statistic. No monthly-climatology averaging is applied.
- id: C108a
  check: \[CMIP7\] \[COORD004\] Coordinate metadata recommendations$
