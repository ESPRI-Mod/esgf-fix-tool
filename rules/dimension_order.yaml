- id: C040
  check: \[CMIP7\] \[COORD002\] Data-variable coordinate order$
  message: '''(?P<var>[^'']+)'' dimensions in netCDF/C order are \[''time'', ''ReffIce'', ''tau'', ''lat'', ''lon''\]; coordinate
    IDs \[''longitude'', ''latitude'', ''effectradic'', ''tau'', ''time''\] require \[''time'', ''tau'', ''effectRadIc'',
    ''lat'', ''lon''\] as their required order\.$'
  action: fix
  fix: fix_data_layout
  params:
    var: '{var}'
    target_order:
    - time
    - tau
    - effectRadIc
    - lat
    - lon
    aliases:
      ReffIce: effectRadIc
  note: Normalize the reviewed coordinate name if needed, then transpose only; prefer ncpdq, otherwise verified Python rewrite.

